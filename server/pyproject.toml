[project]
name = "leaklock"
version = "0.1.0"
description = "Subconscious, the LeakLock helper. A local MCP server."
requires-python = ">=3.12"
dependencies = ["mcp>=1.9,<2", "openpyxl"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
leaklock = "leaklock.server:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
